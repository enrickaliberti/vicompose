        function insertRouteParam(text) {
            const apiDialog = $('dlg-api');
            let target = null;
            const active = document.activeElement;
            if (active && active.tagName === 'INPUT' && apiDialog.contains(active)) {
                target = active;
            } else if (apiDialog.open) {
                target = $('api-input');
            } else {
                target = getActiveExprInput();
            }
            if (!target) return;

            const start = target.selectionStart ?? target.value.length;
            const end   = target.selectionEnd   ?? target.value.length;
            target.value = target.value.slice(0, start) + text + target.value.slice(end);
            const pos = start + text.length;
            target.setSelectionRange(pos, pos);
            target.focus();
            target.dispatchEvent(new Event('input', { bubbles: true }));
            toast('Inserito ' + text);
        }

        function flattenPaths(obj, prefix = '', out = [], depth = 0, maxDepth = 8) {
            if (obj === null || obj === undefined || depth > maxDepth) return out;
            if (Array.isArray(obj)) {
                if (obj.length > 0) flattenPaths(obj[0], prefix ? prefix + '.0' : '0', out, depth + 1, maxDepth);
                return out;
            }
            if (typeof obj !== 'object') return out;
            for (const [k, v] of Object.entries(obj)) {
                const path = prefix ? prefix + '.' + k : k;
                out.push(path);
                if (v !== null && typeof v === 'object') flattenPaths(v, path, out, depth + 1, maxDepth);
            }
            return out;
        }

        function formatValuePreview(v) {
            if (v === null) return 'null';
            if (typeof v === 'string') return JSON.stringify(v).slice(0, 30);
            if (Array.isArray(v)) return '[' + v.length + ']';
            if (typeof v === 'object') return '{' + Object.keys(v).length + '}';
            return String(v);
        }

        function isBranchValue(v) {
            if (v === null || typeof v !== 'object') return false;
            if (Array.isArray(v)) return v.length > 0;
            return Object.keys(v).length > 0;
        }

        function buildJsonTree(obj, parentPath = '', depth = 0) {
            const ul = h('ul', { className: 'list-none m-0 p-0' });
            if (depth > 0) ul.style.paddingLeft = '14px';

            if (Array.isArray(obj)) {
                if (obj.length === 0) {
                    ul.appendChild(h('li', { className: 'text-[10px] text-gray-400 italic py-0.5' }, '[ ] vuoto'));
                    return ul;
                }
                const li = h('li', { className: 'py-0.5 api-tree-row' });
                li.appendChild(buildJsonNode('[0]', obj[0], parentPath ? parentPath + '.0' : '0'));
                ul.appendChild(li);
                return ul;
            }
            if (obj === null || typeof obj !== 'object') return ul;
            for (const [k, v] of Object.entries(obj)) {
                const path = parentPath ? parentPath + '.' + k : k;
                const li = h('li', { className: 'py-0.5 api-tree-row' });
                li.appendChild(buildJsonNode(k, v, path));
                ul.appendChild(li);
            }
            return ul;
        }

        function buildJsonNode(key, value, path) {
            const branch = isBranchValue(value);
            const wrapper = h('div', { className: 'flex items-start gap-1' });

            const toggle = h('button', {
                type: 'button',
                className: 'w-3 h-3 flex items-center justify-center flex-shrink-0 text-gray-400 hover:text-indigo-600 mt-0.5',
                style: 'font-size:8px;line-height:1',
                html: branch ? '&#9654;' : ''
            });

            const label = h('button', {
                type: 'button',
                className: 'text-[10.5px] font-mono text-left hover:text-indigo-600 transition-colors flex items-center gap-1.5 min-w-0',
                title: 'Clicca per inserire {{' + path + '}} nel campo espressione attivo',
                onclick: () => insertFieldIntoActiveInput('{{' + path + '}}')
            });

            label.appendChild(h('span', {
                className: branch ? 'text-indigo-600 font-medium' : 'text-gray-700'
            }, key));

            if (branch) {
                const count = Array.isArray(value) ? value.length : Object.keys(value).length;
                label.appendChild(h('span', { className: 'text-[9px] text-gray-400' },
                    Array.isArray(value) ? '[' + count + ']' : '{' + count + '}'));
            } else {
                label.appendChild(h('span', { className: 'text-gray-400 truncate' },
                    '= ' + formatValuePreview(value)));
            }

            wrapper.appendChild(toggle);
            wrapper.appendChild(label);
            const container = h('div', {}, wrapper);

            if (branch) {
                const childHost = h('div', { className: 'hidden' });
                childHost.appendChild(buildJsonTree(value, path, 0));
                container.appendChild(childHost);

                toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const open = !childHost.classList.contains('hidden');
                    childHost.classList.toggle('hidden', open);
                    toggle.innerHTML = open ? '&#9654;' : '&#9660;';
                });
            }
            return container;
        }

        function switchApiView(view) {
            const tabs = $('api-view-tabs');
            tabs.querySelectorAll('[data-view]').forEach(b => {
                b.className = 'text-[10.5px] font-medium px-2.5 py-1 rounded-t-md transition-colors ' +
                    (b.dataset.view === view ? 'bg-indigo-50 text-indigo-600' : 'text-gray-500 hover:text-gray-700');
            });
            $('api-tree').hidden = view !== 'tree';
            $('api-sample').hidden = view !== 'json';
        }

        function renderApiTreeFromCache() {
            const root = getActiveRoot();
            if (!root || !root.api || !root.api.sampleItem) {
                $('api-view-tabs').hidden = true;
                $('api-tree').hidden = true;
                $('api-sample').hidden = true;
                return;
            }

            const tabs = $('api-view-tabs');
            tabs.hidden = false;
            tabs.innerHTML = '';
            [['tree', 'Struttura'], ['json', 'JSON']].forEach(([view, label], i) => {
                tabs.appendChild(h('button', {
                    type: 'button',
                    dataset: { view },
                    className: 'text-[10.5px] font-medium px-2.5 py-1 rounded-t-md transition-colors ' +
                        (i === 0 ? 'bg-indigo-50 text-indigo-600' : 'text-gray-500 hover:text-gray-700'),
                    onclick: () => switchApiView(view)
                }, label));
            });

            const treeEl = $('api-tree');
            treeEl.innerHTML = '';
            treeEl.appendChild(buildJsonTree(root.api.sampleItem));
            $('api-sample').textContent = JSON.stringify(root.api.sampleItem, null, 2);
            switchApiView('tree');
        }

        async function loadAPI() {
            const root = getActiveRoot();
            if (!root) return;

            const url = $('api-input').value.trim();
            const statusEl = $('api-dialog-status');
            const loadBtn = $('btn-api-load');

            if (!url) { statusEl.innerHTML = '<span class="text-red-500">Inserisci un URL.</span>'; return; }

            loadBtn.disabled = true;
            loadBtn.textContent = 'Carico…';
            statusEl.innerHTML = '<span class="text-gray-400">Recupero dati…</span>';
            $('api-sample').hidden = true;
            $('api-tree').hidden = true;

            try {
                const testUrl = url.replace(/:([a-zA-Z_][a-zA-Z0-9_]*)/g, '1');
                const res = await fetch(testUrl, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                const arr = Array.isArray(data) ? data : [data];
                if (arr.length === 0 || typeof arr[0] !== 'object') throw new Error('Dati non validi');

                const fields = flattenPaths(arr[0]);
                root.api = { url, fields, sampleItem: arr[0], sampleData: arr };

                renderApiTreeFromCache();
                statusEl.innerHTML = `<span class="text-emerald-600">✓ ${fields.length} campi rilevati.</span>`;

                refreshAll();
                renderFilters();
                history.push('Carica API');
                toast(`${fields.length} campi caricati`);
            } catch (err) {
                statusEl.innerHTML = `<span class="text-red-500">Errore: ${escapeHtml(err.message)}</span>`;
                toast('Errore API: ' + err.message, true);
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = 'Carica';
            }
        }

        // ---------------------------------------------------------------
        // FILTRI
        // ---------------------------------------------------------------
        const OPERATORS = [
            { value: '===',        label: '=  uguale' },
            { value: '!==',        label: '≠  diverso' },
            { value: '>',          label: '>  maggiore' },
            { value: '<',          label: '<  minore' },
            { value: '>=',         label: '≥  maggiore uguale' },
            { value: '<=',         label: '≤  minore uguale' },
            { value: '.includes',  label: '⊃  contiene' },
            { value: '.startsWith',label: '↦  inizia con' },
            { value: '.endsWith',  label: '↤  finisce con' }
        ];

        function renderFilters() {
            filtersHost.innerHTML = '';
            const root = getActiveRoot();
            if (!root || !root.api) {
                filtersHost.appendChild(h('div', { className: 'text-[11px] text-gray-400 italic text-center py-3 px-3 bg-gray-50 rounded-lg' },
                    !root ? 'Nessuna radice.' : 'Carica prima un URL per abilitare i filtri.'
                ));
                return;
            }
            if (root.filters.length === 0) {
                filtersHost.appendChild(h('div', { className: 'text-[11px] text-gray-400 italic text-center py-3 px-3 bg-gray-50 rounded-lg' }, 'Nessun filtro configurato.'));
                return;
            }
            root.filters.forEach((f, i) => filtersHost.appendChild(buildFilterCard(f, i, root)));
        }

        function buildFilterCard(filter, index, root) {
            const isDisabled = filter.enabled === false;

            const upBtn = h('button', {
                type: 'button',
                title: 'Sposta su',
                className: 'w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors' + (index === 0 ? ' opacity-30 pointer-events-none' : ''),
                onclick: () => {
                    [root.filters[index - 1], root.filters[index]] = [root.filters[index], root.filters[index - 1]];
                    renderFilters();
                    history.push('Riordina filtri');
                },
                html: '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><polyline points="18 15 12 9 6 15"/></svg>'
            });
            const dnBtn = h('button', {
                type: 'button',
                title: 'Sposta giù',
                className: 'w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors' + (index === root.filters.length - 1 ? ' opacity-30 pointer-events-none' : ''),
                onclick: () => {
                    [root.filters[index], root.filters[index + 1]] = [root.filters[index + 1], root.filters[index]];
                    renderFilters();
                    history.push('Riordina filtri');
                },
                html: '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><polyline points="6 9 12 15 18 9"/></svg>'
            });
            const toggleBtn = h('button', {
                type: 'button',
                title: isDisabled ? 'Attiva' : 'Disattiva',
                className: 'w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-amber-600 hover:bg-amber-50 transition-colors',
                onclick: () => {
                    filter.enabled = isDisabled ? true : false;
                    renderFilters();
                    renderApiBar();
                    history.push('Toggle filtro');
                },
                html: isDisabled
                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>'
            });
            const dupBtn = h('button', {
                type: 'button',
                title: 'Duplica filtro',
                className: 'w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors',
                onclick: () => {
                    root.filters.splice(index + 1, 0, JSON.parse(JSON.stringify(filter)));
                    renderFilters();
                    renderApiBar();
                    history.push('Duplica filtro');
                },
                html: '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
            });
            const rmBtn = h('button', {
                type: 'button',
                className: 'w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors',
                onclick: () => {
                    const p = paramFromValue(filter.value);
                    root.filters.splice(index, 1);
                    if (p && !isParamUsedByOthers(p, null)) removeParamFromPattern(p);
                    renderFilters();
                    renderApiBar();
                    history.push('Rimuovi filtro');
                },
                html: '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>'
            });

            const card = h('div', { className: 'filter-card' + (isDisabled ? ' fc-disabled' : '') },
                h('div', { className: 'fc-head' },
                    h('span', { className: 'fc-type' }, filter.type),
                    h('span', { className: 'flex-1 text-[10px] text-gray-400 font-mono truncate' }, summarizeFilter(filter)),
                    upBtn, dnBtn, toggleBtn, dupBtn, rmBtn
                )
            );

            if (filter.type === 'where')  buildWhereBody(card, filter, root);
            if (filter.type === 'sort')   buildSortBody(card, filter, root);
            if (filter.type === 'limit')  buildLimitBody(card, filter);
            if (filter.type === 'unique') buildUniqueBody(card, filter, root);
            if (filter.type === 'map')    buildMapBody(card, filter, root);

            return card;
        }

        function summarizeFilter(f) {
            if (f.type === 'where') {
                const val = f.value || '';
                const right = val.startsWith(':') ? `params.${val.slice(1)}` : (val || '?');
                return `item.${f.field} ${f.op}${right}`;
            }
            if (f.type === 'sort')   return `${f.field}${f.ascending ? '↑' : '↓'}`;
            if (f.type === 'limit')  return `top ${f.count}`;
            if (f.type === 'unique') return `unique by ${f.field}`;
            if (f.type === 'map')    return `keep ${f.fields?.length || 0} fields`;
            return '';
        }

        function buildWhereBody(card, filter, root) {
            const fields = root.api?.fields || [];

            const colSel = h('select', {
                    onchange: (e) => {
                        const oldField = filter.field;
                        const oldValue = (filter.value || '').trim();
                        const oldParam = paramFromValue(oldValue);
                        const oldDefault = oldField ? ':' + oldField : '';

                        filter.field = e.target.value;
                        if (!oldValue || oldValue === oldDefault) {
                            filter.value = ':' + filter.field;
                            if (oldParam && oldParam !== filter.field) {
                                if (!replaceParamInPattern(oldParam, filter.field)) addParamToPattern(filter.field);
                            } else if (filter.field) {
                                addParamToPattern(filter.field);
                            }
                        }
                        renderFilters();
                        history.push('Modifica filtro');
                    }
                },
                h('option', { value: '' }, '— seleziona —'),
                ...fields.map(f => h('option', { value: f, selected: filter.field === f }, f))
            );

            const opSel = h('select', {
                onchange: (e) => { filter.op = e.target.value; history.push('Modifica filtro'); }
            }, ...OPERATORS.map(op => h('option', { value: op.value, selected: filter.op === op.value }, op.label)));

            const valInp = h('input', {
                type: 'text',
                value: filter.value ?? '',
                placeholder: ':' + (filter.field || 'id') + '  ·  valore',
                onchange: (e) => {
                    const oldParam = paramFromValue(filter.value);
                    const newParam = paramFromValue(e.target.value);
                    filter.value = e.target.value;
                    if (oldParam && !newParam && !isParamUsedByOthers(oldParam, filter)) removeParamFromPattern(oldParam);
                    else if (oldParam && newParam && oldParam !== newParam) replaceParamInPattern(oldParam, newParam);
                    else if (!oldParam && newParam) addParamToPattern(newParam);
                    renderFilters();
                    history.push('Modifica filtro');
                }
            });

            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Colonna'), colSel));
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Operatore'), opSel));
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Valore'), valInp));

            const preview = h('div', { className: 'text-[10px] font-mono text-indigo-600 mt-2 truncate' });
            function updateFilterPreview() {
                const val = (filter.value || '').trim();
                const right = val.startsWith(':') ? 'params.' + val.slice(1) : JSON.stringify(val);
                preview.textContent = '→ item.' + (filter.field || '?') + ' ' + filter.op + ' ' + right;
            }
            updateFilterPreview();
            valInp.addEventListener('input', () => { filter.value = valInp.value; updateFilterPreview(); });
            card.appendChild(preview);
        }

        function buildSortBody(card, filter, root) {
            const fields = root.api?.fields || [];
            const sel = h('select', { onchange: (e) => { filter.field = e.target.value; history.push('Modifica sort'); } },
                h('option', { value: '' }, '— seleziona —'),
                ...fields.map(f => h('option', { value: f, selected: filter.field === f }, f))
            );
            const dir = h('select', { onchange: (e) => { filter.ascending = e.target.value === '1'; history.push('Modifica sort'); } },
                h('option', { value: '1', selected: filter.ascending !== false }, '↑ Crescente'),
                h('option', { value: '0', selected: filter.ascending === false }, '↓ Decrescente')
            );
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Colonna'), sel));
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Direzione'), dir));
        }

        function buildLimitBody(card, filter) {
            const inp = h('input', {
                type: 'text',
                value: filter.count ?? 10,
                oninput: (e) => { filter.count = parseInt(e.target.value, 10) || 0; },
                onchange: () => history.push('Modifica limit')
            });
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Numero massimo'), inp));
        }

        function buildUniqueBody(card, filter, root) {
            const fields = (root.api?.fields || []).filter(f => !f.includes('.'));
            const sel = h('select', { onchange: (e) => { filter.field = e.target.value; history.push('Modifica unique'); } },
                h('option', { value: '' }, '— seleziona —'),
                ...fields.map(f => h('option', { value: f, selected: filter.field === f }, f))
            );
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Colonna unica'), sel));
            if (fields.length === 0) {
                card.appendChild(h('div', { className: 'text-[10px] text-amber-600 italic mt-1' },
                    'Nessun campo di primo livello disponibile.'));
            }
        }

        function buildMapBody(card, filter, root) {
            const fields = (root.api?.fields || []).filter(f => !f.includes('.'));
            if (!filter.fields) filter.fields = [];
            const grid = h('div', { className: 'grid grid-cols-2 gap-1' });

            fields.forEach(f => {
                const cb = h('input', {
                    type: 'checkbox',
                    checked: filter.fields.includes(f),
                    onchange: (e) => {
                        if (e.target.checked) { if (!filter.fields.includes(f)) filter.fields.push(f); }
                        else filter.fields = filter.fields.filter(x => x !== f);
                        history.push('Modifica map');
                    }
                });
                grid.appendChild(h('label', { className: 'flex items-center gap-1.5 text-[10.5px] text-gray-600 cursor-pointer' }, cb, f));
            });
            card.appendChild(h('div', { className: 'fc-row' }, h('label', {}, 'Campi da mantenere'), grid));
        }

        $('btn-add-filter').addEventListener('click', (e) => {
            e.preventDefault();
            const root = getActiveRoot();
            if (!root?.api) { toast('Carica prima un API.', true); return; }

            $('dlg-api').querySelectorAll('.__vc-filter-menu').forEach(n => n.remove());

            const menu = h('div', { className: '__vc-filter-menu' },
                ...[
                    { t: 'where',  label: 'Where — filtra' },
                    { t: 'sort',   label: 'Sort — ordina' },
                    { t: 'limit',  label: 'Limit — limita' },
                    { t: 'unique', label: 'Unique — deduplica' },
                    { t: 'map',    label: 'Map — trasforma' }
                ].map(opt => h('button', {
                    type: 'button',
                    onclick: () => { menu.remove(); addFilter(opt.t); }
                }, opt.label))
            );
            $('dlg-api').appendChild(menu);
            const aRect = e.currentTarget.getBoundingClientRect();
            const dRect = $('dlg-api').getBoundingClientRect();
            menu.style.left = (aRect.left - dRect.left) + 'px';
            menu.style.top = (aRect.bottom - dRect.top + 4) + 'px';

            setTimeout(() => {
                const close = (ev) => {
                    if (!menu.contains(ev.target)) {
                        menu.remove();
                        document.removeEventListener('mousedown', close, true);
                    }
                };
                document.addEventListener('mousedown', close, true);
            }, 0);
        });

        function addFilter(type) {
            const root = getActiveRoot();
            if (!root?.api) return;
            const firstField = root.api.fields[0] || '';

            if (type === 'where') {
                root.filters.push({ type: 'where', field: firstField, op: '===', value: ':' + firstField, enabled: true });
                if (firstField) addParamToPattern(firstField);
            } else if (type === 'sort') {
                root.filters.push({ type: 'sort', field: firstField, ascending: true, enabled: true });
            } else if (type === 'limit') {
                root.filters.push({ type: 'limit', count: 10, enabled: true });
            } else if (type === 'unique') {
                root.filters.push({ type: 'unique', field: firstField, enabled: true });
            } else if (type === 'map') {
                root.filters.push({ type: 'map', fields: [], enabled: true });
            }
            renderFilters();
            renderApiBar();
            history.push('Aggiungi filtro');
        }

        // ---------------------------------------------------------------
        // PREVIEW (bind)
        // ---------------------------------------------------------------
        function buildLiveMappingForRoot(root) {
            const out = {};
            for (const [rel, m] of root.mappings) {
                const props = {};
                m.props.forEach(p => {
                    if (p.property && (p.expression || '').trim()) {
                        const live = expressionToLive(p.expression);
                        if (live != null) props[p.property] = live;
                    }
                });
                if (Object.keys(props).length > 0) out[rel] = props;
            }
            return out;
        }

        function updateModeButtons() {
            document.querySelectorAll('[data-mode]').forEach(b => {
                b.className = `px-3.5 py-1.5 text-xs font-medium rounded-md transition-colors ${b.dataset.mode === state.mode ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`;
            });
        }

        async function setMode(mode) {
            state.mode = mode;
            updateModeButtons();
            await renderCanvas();
            if (mode === 'edit') {
                instrument();
                reattachRootNodes();
                refreshAll();
            } else {
                try {
                    await ensureFramework();
                    await runBind();
                    toast('Anteprima generata');
                } catch (err) {
                    toast('Errore anteprima: ' + err.message, true);
                    const doc = iframe.contentDocument;
                    if (doc && doc.body) {
                        doc.body.innerHTML = `<div style="padding:24px;font-family:system-ui;color:#dc2626">
                            <div style="font-weight:600;margin-bottom:6px">Errore anteprima</div>
                            <div style="font-size:13px;color:#6b7280">${escapeHtml(err.message)}</div>
                        </div>`;
                    }
                }
            }
            renderRouteBar();
        }

        function reattachRootNodes() {
            const doc = iframe.contentDocument;
            if (!doc) return;
            const toRemove = [];
            for (const [sel, entry] of state.roots) {
                const node = doc.querySelector(sel);
                if (node) entry.node = node;
                else toRemove.push(sel);
            }
            toRemove.forEach(sel => {
                state.roots.delete(sel);
                if (state.activeRootSelector === sel) state.activeRootSelector = null;
            });
            if (state.activeRootSelector && state.roots.get(state.activeRootSelector)?.node) {
                doc.querySelectorAll('.__vc-root').forEach(n => n.classList.remove('__vc-root'));
                state.roots.get(state.activeRootSelector).node.classList.add('__vc-root');
            }
            state.selected = null;
            updateToolbar(null);
        }

        // Sorgenti del framework, in ordine di priorità:
        //  1) copia locale nel repo (../src/visualcompose.js): l'editor usa sempre
        //     la versione del framework che sta nello stesso commit;
        //  2) CDN jsDelivr (versione fissata) come ripiego.
        function vcSources() {
            const local = new URL('../src/visualcompose.js', location.href).href;
            return [local, vcCdnUrl()];
        }
        function vcCdnUrl() {
            return VC_CDN_URL;
        }

        async function ensureFramework() {
            const win = iframe.contentWindow;
            if (win.VisualCompose) return;
            const s = iframe.contentDocument.createElement('script');
            s.type = 'module';
            s.textContent = `(async () => {
                for (const u of ${JSON.stringify(vcSources())}) {
                    try {
                        const m = await import(u);
                        window.VisualCompose = m.default || m.VisualCompose;
                        window.__vcSource = u;
                        return;
                    } catch (e) { /* prova la sorgente successiva */ }
                }
                window.__vcLoadFailed = true;
            })();`;
            iframe.contentDocument.head.appendChild(s);

            await new Promise((resolve, reject) => {
                const t0 = Date.now();
                const check = () => {
                    if (win.VisualCompose) resolve();
                    else if (win.__vcLoadFailed) reject(new Error('Impossibile caricare VisualCompose (né dal repo né dal CDN)'));
                    else if (Date.now() - t0 > 8000) reject(new Error('Timeout: impossibile caricare VisualCompose'));
                    else setTimeout(check, 50);
                };
                check();
            });
        }

        async function runBind() {
            if (state.roots.size === 0) {
                throw new Error(
                    'Nessuna radice configurata. ' +
                    'Seleziona un elemento nel canvas per usarlo come radice (diventa viola).'
                );
            }

            const vc = new (iframe.contentWindow.VisualCompose)();
            const params = {};
            extractParams(state.routePattern || '').forEach(p => {
                params[p] = state.previewParamValues[p] || '1';
            });
            vc.router.currentParams = params;

            let bound = 0;
            let rootsWithMapping = 0;
            let rootsWithoutMapping = 0;
            let rootsWithMappingNoApi = 0;

            for (const [sel, entry] of state.roots) {
                const liveMapping = buildLiveMappingForRoot(entry);
                if (!Object.keys(liveMapping).length) {
                    rootsWithoutMapping++;
                    continue;
                }
                rootsWithMapping++;

                if (!entry.api?.sampleData) {
                    rootsWithMappingNoApi++;
                    continue;
                }

                const data = applyPreviewFilters(entry.api.sampleData, entry, params);
                await vc.bind(sel, () => data, liveMapping, {
                    loading: 'Caricamento…',
                    empty: '<div style="padding:20px;text-align:center;opacity:.6">Nessun dato.</div>',
                    error: '<div style="padding:20px;text-align:center;color:#dc2626">Errore.</div>'
                });
                bound++;
            }

            if (bound > 0) return;

            if (rootsWithMapping === 0 && rootsWithMappingNoApi === 0) {
                throw new Error(
                    'Nessuna proprietà mappata. ' +
                    'Apri "Mappatura", seleziona un nodo nel canvas e compila il campo espressione ' +
                    '(es. clicca un "Campo rapido" o scrivi {{id}}).'
                );
            }

            if (rootsWithMappingNoApi > 0 && rootsWithMappingNoApi === rootsWithMapping) {
                throw new Error(
                    'Mappature configurate ma nessuna API caricata. ' +
                    'Apri "Mappatura" → "Imposta API" e carica un URL JSON.'
                );
            }

            throw new Error(
                'Nessuna radice pronta per l\'anteprima. ' +
                'Verifica che almeno una radice abbia API caricata e almeno una proprietà con espressione.'
            );
        }

        function applyPreviewFilters(data, entry, params) {
            let result = Array.isArray(data) ? data.slice() : [data];
            for (const f of entry.filters || []) {
                if (f.enabled === false) continue;
                if (f.type === 'where' && f.field && (f.value || '').trim()) {
                    const isParam = f.value.startsWith(':');
                    const right = isParam ? params[f.value.slice(1)] : autoLiteralValue(f.value);
                    result = result.filter(item => {
                        const v = getPath(item, f.field);
                        if (f.op === '.includes')   return typeof v === 'string' && v.includes(right);
                        if (f.op === '.startsWith') return typeof v === 'string' && v.startsWith(right);
                        if (f.op === '.endsWith')   return typeof v === 'string' && v.endsWith(right);
                        if (f.op === '===') return v === right || String(v) === String(right);
                        if (f.op === '!==') return v !== right;
                        if (f.op === '>')   return v > right;
                        if (f.op === '<')   return v < right;
                        if (f.op === '>=')  return v >= right;
                        if (f.op === '<=')  return v <= right;
                        return false;
                    });
                } else if (f.type === 'sort') {
                    result.sort((a, b) => {
                        const av = getPath(a, f.field);
                        const bv = getPath(b, f.field);
                        return f.ascending !== false ? (av > bv ? 1 : av < bv ? -1 : 0)
                            : (bv > av ? 1 : bv < av ? -1 : 0);
                    });
                } else if (f.type === 'limit') {
                    result = result.slice(0, f.count || 10);
                } else if (f.type === 'unique') {
                    const seen = new Set();
                    result = result.filter(item => {
                        const k = getPath(item, f.field);
                        if (k === undefined || k === null || seen.has(k)) return false;
                        seen.add(k);
                        return true;
                    });
                } else if (f.type === 'map' && f.fields?.length) {
                    result = result.map(item => {
                        const o = {};
                        f.fields.forEach(k => { o[k] = getPath(item, k); });
                        return o;
                    });
                }
            }
            return result;
        }

        function autoLiteralValue(val) {
            if (val === 'true') return true;
            if (val === 'false') return false;
            if (val === 'null') return null;
            return /^-?\d+(\.\d+)?$/.test(val) ? parseFloat(val) : val;
        }

        // ---------------------------------------------------------------
        // MODAL HTML
        // ---------------------------------------------------------------
        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => btn.closest('dialog')?.close());
        });

        $('btn-html').addEventListener('click', () => {
            syncStateFromIframe();
            $('html-input').value = state.html;
            $('dlg-html').showModal();
        });

        $('btn-html-save').addEventListener('click', async () => {
            state.html = $('html-input').value;
            $('dlg-html').close();
            state.roots.clear();
            state.activeRootSelector = state.selected = null;
            state.routePattern = '';
            state.treeCollapsed.clear();
            await renderCanvas();
            instrument();
            refreshAll();
            history.push('Modifica HTML');
            toast('HTML aggiornato');
        });

        $('btn-api-load').addEventListener('click', loadAPI);
        $('api-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); loadAPI(); }
        });

        document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

        // ---------------------------------------------------------------
        // SCORCIATOIE DA TASTIERA
        // ---------------------------------------------------------------
        // Gestore unico: registrato sia sul documento principale sia su quello
        // dell'iframe (dopo un click nel canvas il focus è dentro l'iframe e
        // gli eventi da tastiera non risalgono alla pagina principale).
        function onEditorKeydown(e) {
            const active = (e.target && e.target.ownerDocument !== document)
                ? e.target
                : document.activeElement;
            const inInput = ['INPUT','TEXTAREA','SELECT'].includes(active?.tagName) || active?.isContentEditable;
            const inDialog = active?.closest?.('dialog[open]');

            if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) {
                if (inInput && !e.shiftKey) {
                    const isEditorInput = active.closest?.('#props-host, #dlg-api, #route-pattern, #html-input');
                    if (!isEditorInput) return;
                }
                e.preventDefault();
                if (e.shiftKey) history.redo();
                else history.undo();
                return;
            }

            if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) {
                e.preventDefault();
                history.redo();
                return;
            }

            if (e.ctrlKey && (e.key === 'd' || e.key === 'D')) {
                if (state.selected) {
                    e.preventDefault();
                    duplicateNode(state.selected);
                }
                return;
            }

            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                setMode(state.mode === 'edit' ? 'preview' : 'edit');
                return;
            }

            if (inInput || inDialog) return;

            if (e.key === 'Escape') {
                if (state.selected) { selectNode(null); e.preventDefault(); }
                closeContextMenu();
                document.querySelectorAll('.prop-menu').forEach(m => m.remove());
                return;
            }

            if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected) {
                e.preventDefault();
                deleteNode(state.selected);
                return;
            }

            if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && state.selected) {
                e.preventDefault();
                const root = getActiveRoot();
                if (!root) return;
                const allNodes = [root.node, ...root.node.querySelectorAll('*')].filter(n => !SKIP.has(n.tagName));
                const idx = allNodes.indexOf(state.selected);
                if (idx < 0) return;
                const next = allNodes[idx + (e.key === 'ArrowUp' ? -1 : 1)];
                if (next) {
                    selectNode(next);
                    try { next.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
                }
                return;
            }

            if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && state.selected) {
                e.preventDefault();
                moveNode(state.selected, e.key === 'ArrowUp' ? -1 : 1);
                return;
            }
        }
        document.addEventListener('keydown', onEditorKeydown);

        // ---------------------------------------------------------------
        // INIT
        // ---------------------------------------------------------------
        (async function init() {
            if (LOAD_ERROR) toast(LOAD_ERROR, true);
            state.html = INITIAL_HTML || '';
            state.head = INITIAL_HEAD || '';
            state.mode = 'edit';
            updateModeButtons();
            updateMappingBadge();
            await renderCanvas();
            instrument();

            let restoredConfig = false;
            if (INITIAL_CONFIG) {
                try {
                    const cfg = JSON.parse(INITIAL_CONFIG);
                    restoredConfig = restoreConfig(cfg);
                } catch (err) {
                    console.warn('[VisualCompose] Config non valida:', err);
                }
            }

            refreshAll();
            history.pushNow('Stato iniziale');
            autosave.start();
            updateDraftBadge();

            if (restoredConfig) {
                $('config-badge').classList.remove('hidden');
                setTimeout(() => $('config-badge').classList.add('hidden'), 4000);
                toast(`Config ripristinata (${state.roots.size} radici)`);
            }

            setTimeout(() => {
                hint('Ctrl+Z annulla · Doppio click = radice · Click destro = menu', 5000);
            }, 1200);
        })();

    })();
</script>
</body>
</html>
